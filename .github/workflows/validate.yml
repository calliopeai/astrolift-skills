name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only — no `pip install` step. The validator checks that
      # every skills/*/SKILL.md has the required frontmatter and that
      # catalogue.json is in sync with the skills on disk.
      - name: Validate skill frontmatter + catalogue drift
        run: python scripts/validate_skills.py

      # Byte-compile every helper so a syntactically broken script can't
      # ship in the baseline catalogue.
      - name: Byte-compile helper scripts
        run: python -m compileall -q scripts skills
